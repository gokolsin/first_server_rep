server {
    listen 80;
    listen [::]:80;
    server_name gokolsin.ru;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gokolsin.ru;

    ssl_certificate /etc/letsencrypt/live/gokolsin.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gokolsin.ru/privkey.pem;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
    }
}
